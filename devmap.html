// ---------------------------------------------------------------------------
// Rendering. Reads only from DATA. All text goes in through textContent.
// ---------------------------------------------------------------------------
(function () {
  "use strict";

  var KIND_LABEL = {
    done: "done", progress: "in progress", planned: "planned", failing: "failing", owner: "needs owner"
  };
  var COMMIT_TAG = {
    fix: "fix", feat: "feature", docs: "docs", chore: "build", mixed: "feature + fixes", other: "no detail"
  };
  var SEV_CLASS = { "blocks launch": "sev-block", "should fix": "sev-fix", "known limit": "sev-limit" };
  var AREAS = ["Data & caching", "Flights & prices", "Destination page", "Globe & home",
    "Explore & trip builder", "Stays", "Accounts & email", "Trips hub", "Design & pages", "Docs", "Quality"];

  var state = {}; // section key -> open (true by default)
  var manual = {}; // while searching: section key -> open, set by a click
  var SECTIONS = [
    { key: "summary", title: "Status summary", icon: "" },
    { key: "next", title: "Recommended next step", icon: "" },
    { key: "done", title: "Done", icon: "✓", list: DATA.done, count: DATA.done.length },
    { key: "progress", title: "In progress", icon: "◐", list: DATA.inProgress, count: DATA.inProgress.length },
    { key: "planned", title: "Planned, not started", icon: "○", list: DATA.planned, count: DATA.planned.length },
    { key: "failing", title: "Failing or unverified", icon: "✕", list: DATA.failing, count: DATA.failing.length },
    { key: "owner", title: "Needs the owner", icon: "⚑", list: DATA.needsOwner, count: DATA.needsOwner.length },
    { key: "history", title: "Recent history", icon: "•", list: DATA.commits, count: DATA.commits.length }
  ];
  SECTIONS.forEach(function (s) { state[s.key] = true; });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function query() { return (document.getElementById("q").value || "").trim().toLowerCase(); }
  function hit(str, q) { return !q || str.toLowerCase().indexOf(q) !== -1; }
  // While a search is active every section opens so matches are visible; a click
  // then sets that section's state for the search, and clearing the search restores state.
  function sectionOpen(key) {
    if (query() !== "") return key in manual ? manual[key] : true;
    return state[key];
  }

  function itemSearch(it) {
    return [it.text, it.area, it.note, it.src, it.severity, it.subject, it.hash, it.date]
      .filter(Boolean).join(" ");
  }

  function markFor(sectionKey, it) {
    if (sectionKey === "done") return ["✓", "m-done"];
    if (sectionKey === "progress") return ["◐", "m-prog"];
    if (sectionKey === "planned") return ["○", "m-plan"];
    if (sectionKey === "failing") return ["✕", "m-fail"];
    if (sectionKey === "owner") return ["⚑", "m-owner"];
    return ["•", ""];
  }

  function renderItem(sectionKey, it) {
    var li = el("li");
    li.dataset.search = itemSearch(it).toLowerCase();
    var mk = markFor(sectionKey, it);
    li.appendChild(el("span", "mark " + mk[1] + " ", mk[0]));
    li.firstChild.setAttribute("aria-hidden", "true");
    var body = el("div");
    if (sectionKey === "history") {
      li.remove();
      return null;
    }
    if (sectionKey === "failing") {
      var sev = el("span", "sev " + (SEV_CLASS[it.severity] || ""), it.severity);
      body.appendChild(sev);
    }
    body.appendChild(el("span", "t", it.text));
    if (it.note) body.appendChild(el("div", "n", it.note));
    if (it.src) body.appendChild(el("div", "src", "Source: " + it.src));
    li.appendChild(body);
    return li;
  }

  function renderHistoryItem(c) {
    var li = el("li");
    li.dataset.search = itemSearch(c).toLowerCase();
    var head = el("div");
    head.appendChild(el("code", "hash", c.hash));
    head.appendChild(el("span", "when", "  " + c.date));
    head.appendChild(el("span", "kind", COMMIT_TAG[c.kind] || c.kind));
    li.appendChild(head);
    li.appendChild(el("div", "subj", c.subject));
    return li;
  }

  function sectionShell(s) {
    var sec = el("section", "panel");
    sec.id = "sec-" + s.key;
    var h = el("h2");
    h.id = "h-" + s.key;
    var btn = el("button", "toggle");
    btn.type = "button";
    btn.id = "btn-" + s.key;
    btn.setAttribute("aria-controls", "body-" + s.key);
    btn.setAttribute("aria-expanded", "true");
    btn.dataset.sec = s.key;
    if (s.icon) btn.appendChild(el("span", "ico", s.icon)).setAttribute("aria-hidden", "true");
    btn.appendChild(document.createTextNode(s.title));
    var cnt = el("span", "count");
    cnt.dataset.count = s.key;
    btn.appendChild(cnt);
    var chev = el("span", "chev", "▾");
    chev.setAttribute("aria-hidden", "true");
    btn.appendChild(chev);
    h.appendChild(btn);
    sec.appendChild(h);
    var body = el("div", "body");
    body.id = "body-" + s.key;
    body.setAttribute("role", "region");
    body.setAttribute("aria-labelledby", "btn-" + s.key);
    sec.appendChild(body);
    return { sec: sec, body: body, btn: btn, cnt: cnt };
  }

  function buildFacts() {
    var f = document.getElementById("facts");
    var rows = [
      ["Generated", DATA.generated],
      ["Branch", DATA.branch],
      ["Last commit", DATA.lastCommit.hash + "  " + DATA.lastCommit.subject]
    ];
    rows.forEach(function (r) {
      var d = el("div");
      d.appendChild(el("b", "", r[0] + ":"));
      if (r[0] === "Last commit") {
        d.appendChild(el("code", "", DATA.lastCommit.hash));
        d.appendChild(document.createTextNode("  " + DATA.lastCommit.subject));
      } else {
        d.appendChild(document.createTextNode(r[1]));
      }
      f.appendChild(d);
    });
    var sub = el("p", "meta", DATA.project + ". " + DATA.subtitle + ". Development map for the owner.");
    f.appendChild(sub);
  }

  function buildMain() {
    var main = document.getElementById("main");
    var q = "";

    // 1. Summary tiles (counts derived from the lists)
    var s0 = SECTIONS[0];
    var sh0 = sectionShell(s0);
    var tiles = el("div", "tiles");
    var counts = [
      ["✓", "Done", DATA.done.length, "items"],
      ["◐", "In progress", DATA.inProgress.length, "items"],
      ["○", "Planned (not started)", DATA.planned.length, "items"],
      ["⚑", "Blocked or needs owner", DATA.needsOwner.length, "owner actions"]
    ];
    counts.forEach(function (c) {
      var t = el("div", "tile");
      t.appendChild(el("div", "num", String(c[2])));
      var lbl = el("div", "lbl");
      var ic = el("span", "ico", c[0]);
      ic.setAttribute("aria-hidden", "true");
      lbl.appendChild(ic);
      lbl.appendChild(document.createTextNode(c[1]));
      t.appendChild(lbl);
      t.appendChild(el("div", "sub", c[3]));
      tiles.appendChild(t);
    });
    sh0.body.appendChild(tiles);
    sh0.body.appendChild(el("p", "meta", "Failing or unverified items are listed separately below: " + DATA.failing.length + " in total."));
    sh0.cnt.textContent = "4 tiles";
    main.appendChild(sh0.sec);

    // 2. Recommended next step
    var s1 = SECTIONS[1];
    var sh1 = sectionShell(s1);
    var card = el("div", "next");
    card.appendChild(el("p", "eyebrow", DATA.nextStep.namesOne ? "Recommended" : "Not named in the sources"));
    card.appendChild(el("p", "", DATA.nextStep.text));
    card.appendChild(el("p", "muted", DATA.nextStep.pointer));
    card.appendChild(el("p", "", "Why: " + DATA.nextStep.why));
    card.appendChild(el("p", "src", "Source: " + DATA.nextStep.src));
    sh1.body.appendChild(card);
    sh1.cnt.textContent = "1 card";
    main.appendChild(sh1.sec);

    // 3..8 item lists
    SECTIONS.slice(2).forEach(function (s) {
      var sh = sectionShell(s);
      if (s.key === "done") {
        AREAS.forEach(function (area) {
          var group = el("div", "area");
          group.dataset.area = area;
          group.appendChild(el("h3", "", area));
          var ul = el("ul", "items");
          DATA.done.filter(function (d) { return d.area === area; }).forEach(function (d) {
            var li = renderItem("done", d);
            ul.appendChild(li);
          });
          group.appendChild(ul);
          sh.body.appendChild(group);
        });
      } else if (s.key === "history") {
        var ol = el("ol", "timeline");
        DATA.commits.forEach(function (c) { ol.appendChild(renderHistoryItem(c)); });
        sh.body.appendChild(el("p", "meta", "Newest first. Fix commits are marked \"fix\"; \"feature + fixes\" marks a feat commit that also contains security or bug fixes."));
        sh.body.appendChild(ol);
      } else {
        var ul2 = el("ul", "items");
        s.list.forEach(function (it) { ul2.appendChild(renderItem(s.key, it)); });
        sh.body.appendChild(ul2);
      }
      var empty = el("p", "empty", "No items match the search in this section.");
      empty.hidden = true;
      empty.dataset.empty = s.key;
      sh.body.insertBefore(empty, sh.body.firstChild);
      sh.count = s.count;
      sh.cnt.dataset.total = String(s.count);
      main.appendChild(sh.sec);
      s.shell = sh;
    });

    // Uncommitted note is part of In progress; history note is in its section.
    buildFoot();
  }

  function buildFoot() {
    var f = document.getElementById("foot");
    f.textContent = "Generated " + DATA.generated + " from STATUS.md, docs/finish-plan.md, progress.md, docs/design-direction.md, docs/design-trip-builder.md, docs/design-destination.md, docs/testing.md, WHAT-I-NEED-FROM-YOU.md and the last 15 commits. Nothing was re-run. Edit DATA at the top of the script to change a status.";
  }

  function applyFilter() {
    var q = query();
    SECTIONS.slice(2).forEach(function (s) {
      var sh = s.shell;
      var open = sectionOpen(s.key);
      sh.body.hidden = !open;
      sh.btn.setAttribute("aria-expanded", open ? "true" : "false");
      var visible = 0;
      var items = sh.body.querySelectorAll("li[data-search]");
      Array.prototype.forEach.call(items, function (li) {
        var ok = hit(li.dataset.search, q);
        li.hidden = !ok;
        if (ok) visible++;
      });
      sh.body.querySelectorAll("div.area").forEach(function (g) {
        var any = g.querySelectorAll("li[data-search]:not([hidden])").length > 0;
        g.hidden = !any;
      });
      var empty = sh.body.querySelector("p.empty[data-empty]");
      if (empty) empty.hidden = !(q && visible === 0);
      sh.cnt.textContent = q ? (visible + " of " + s.count + " shown") : (s.count + " items");
    });
    // Summary and next step sections
    SECTIONS.slice(0, 2).forEach(function (s) {
      var btn = document.getElementById("btn-" + s.key);
      var body = document.getElementById("body-" + s.key);
      var open = sectionOpen(s.key);
      body.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }

  function toMarkdown() {
    var q = query();
    var out = [];
    out.push("# Voyagr development map (" + DATA.generated + ")");
    out.push("");
    out.push("Branch: " + DATA.branch);
    out.push("Last commit: " + DATA.lastCommit.hash + " " + DATA.lastCommit.subject);
    out.push("");
    if (sectionOpen("summary")) {
      out.push("## Status summary");
      out.push("- Done: " + DATA.done.length);
      out.push("- In progress: " + DATA.inProgress.length);
      out.push("- Planned (not started): " + DATA.planned.length);
      out.push("- Blocked or needs owner: " + DATA.needsOwner.length);
      out.push("");
    }
    if (sectionOpen("next") && hit(DATA.nextStep.text + " " + DATA.nextStep.pointer + " " + DATA.nextStep.why, q)) {
      out.push("## Recommended next step");
      out.push(DATA.nextStep.text);
      out.push(DATA.nextStep.pointer);
      out.push("Why: " + DATA.nextStep.why);
      out.push("");
    }
    SECTIONS.slice(2).forEach(function (s) {
      if (!sectionOpen(s.key)) return;
      var lines = [];
      if (s.key === "done") {
        AREAS.forEach(function (area) {
          var items = DATA.done.filter(function (d) { return d.area === area && hit(itemSearch(d), q); });
          if (!items.length) return;
          lines.push("### " + area);
          items.forEach(function (d) { lines.push("- ✓ " + d.text); });
        });
      } else if (s.key === "history") {
        DATA.commits.filter(function (c) { return hit(itemSearch(c), q); })
          .forEach(function (c) { lines.push("- " + c.hash + " (" + c.date + ") " + c.subject); });
      } else {
        var icon = markFor(s.key, {})[0];
        s.list.filter(function (it) { return hit(itemSearch(it), q); }).forEach(function (it) {
          var line = "- " + icon + " ";
          if (it.severity) line += "[" + it.severity + "] ";
          line += it.text;
          if (it.note) line += " (" + it.note + ")";
          if (it.src) line += " [source: " + it.src + "]";
          lines.push(line);
        });
      }
      if (!lines.length) return;
      out.push("## " + s.title);
      out.push("");
      lines.forEach(function (l) { out.push(l); });
      out.push("");
    });
    return out.join("\n");
  }

  function copyMarkdown() {
    var md = toMarkdown();
    var status = document.getElementById("copy-status");
    var fb = document.getElementById("copy-fallback");
    var ta = document.getElementById("md-out");
    function fallback(msg) {
      fb.hidden = false;
      ta.value = md;
      status.textContent = msg;
      ta.focus();
      ta.select();
    }
    function ok() {
      fb.hidden = true;
      status.textContent = "Copied the visible content as Markdown.";
    }
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      navigator.clipboard.writeText(md).then(ok, function () {
        fallback("Clipboard write was refused by the browser. The text is selected below: press Ctrl+C (or Cmd+C).");
      });
    } else {
      fallback("Clipboard is not available in this browser or context. The text is selected below: press Ctrl+C (or Cmd+C).");
    }
  }

  function init() {
    buildFacts();
    buildMain();
    applyFilter();

    document.getElementById("main").addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("button.toggle") : null;
      if (!b) return;
      var key = b.dataset.sec;
      if (query()) {
        manual[key] = !sectionOpen(key);
      } else {
        state[key] = !state[key];
      }
      applyFilter();
    });
    document.getElementById("q").addEventListener("input", function () {
      manual = {};
      applyFilter();
    });
    document.getElementById("copy-md").addEventListener("click", copyMarkdown);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
