<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Voyagr development map</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #05070e;
    --fg: #ffffff;
    --muted: #98a0b0;
    --accent: #c98a52;
    --surface: #0b1020;
    --surface-2: #101829;
    --border: #1c2438;
    --border-strong: #2b3652;
    --ok: #7fd1a0;
    --bad: #ff8a80;
    --warn: #e8c170;
    --plan: #8fa6d6;
    --focus: #f2c49a;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  h1, h2, h3 { line-height: 1.2; margin: 0; font-family: var(--sans); }
  h1 { font-size: 2rem; font-weight: 650; letter-spacing: -.01em; }
  .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; margin: 0 0 6px; font-weight: 600; }
  .muted { color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  code { font-family: var(--mono); font-size: .9em; color: var(--accent); background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }

  /* Header: one line per fact */
  header.top { border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 20px; }
  .tagline { color: var(--muted); margin: 6px 0 0; font-size: .95rem; }
  .facts { display: grid; gap: 4px; margin-top: 14px; min-width: 0; }
  .fact { display: flex; gap: 10px; align-items: baseline; min-width: 0; font-size: .95rem; }
  .fact .k { flex: 0 0 5.5rem; color: var(--muted); }
  .fact .v { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fact .v code { margin-right: 6px; }
  .live-status { color: var(--muted); font-size: .85rem; margin: 12px 0 0; overflow-wrap: anywhere; }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 0 0 12px; }
  .toolbar label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .toolbar input[type="search"] {
    width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 8px;
    background: var(--surface); color: var(--fg); border: 1px solid var(--border-strong); font: inherit;
  }
  .toolbar input[type="search"]::placeholder { color: var(--muted); opacity: 1; }
  .toolbar .grow { flex: 1 1 240px; min-width: 0; }
  .btn {
    min-height: 44px; min-width: 44px; padding: 8px 18px; border-radius: 8px;
    background: var(--accent); color: #05070e; border: 0; font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
  .live { min-height: 1.5em; color: var(--muted); font-size: .9rem; margin: 0 0 12px; overflow-wrap: anywhere; }
  .fallback textarea {
    width: 100%; min-height: 160px; margin: 8px 0 16px; padding: 10px; border-radius: 8px;
    background: var(--surface); color: var(--fg); border: 1px solid var(--border-strong); font: .85rem/1.4 var(--mono);
  }

  /* Status strip */
  .strip { margin: 8px 0 0; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
  .tile {
    display: block; min-width: 0; min-height: 44px; text-decoration: none; color: var(--fg);
    background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--tone, var(--border-strong));
    border-radius: 12px; padding: 14px 14px 12px;
  }
  a.tile:hover { background: var(--surface-2); }
  .tile .lbl { display: flex; align-items: center; gap: 8px; font-size: .95rem; font-weight: 600; }
  .tile .ico { color: var(--tone, var(--muted)); font-size: 1.05rem; width: 1.2em; text-align: center; }
  .tile .num { font-size: 2.4rem; font-weight: 650; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .sub { color: var(--muted); font-size: .85rem; }
  .t-done { --tone: var(--ok); }
  .t-prog { --tone: var(--accent); }
  .t-plan { --tone: var(--plan); }
  .t-owner { --tone: var(--warn); }
  .bar { display: flex; gap: 3px; height: 12px; margin: 14px 0 0; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
  .bar span { display: block; min-width: 3px; background: var(--tone); }
  .bar .t-plan { background-image: repeating-linear-gradient(135deg, rgba(5,7,14,.55) 0 2px, transparent 2px 6px); }
  .bar .t-owner { background-image: repeating-linear-gradient(45deg, rgba(5,7,14,.55) 0 2px, transparent 2px 6px); }
  .bar-note { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
  .bar-note a { color: var(--bad); }

  /* Next step */
  .next { margin-top: 24px; background: var(--surface); border: 1px solid var(--accent); border-left-width: 6px; border-radius: 12px; padding: 16px 18px; }
  .next h2 { font-size: 1.25rem; margin-top: 2px; }
  .next p { margin: 8px 0 0; overflow-wrap: anywhere; }
  .next .src, .src { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }

  /* Collapsible sections */
  section.panel { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 4px; }
  section.panel > h2 { margin: 0; }
  .toggle {
    width: 100%; min-height: 48px; display: flex; align-items: center; gap: 10px; text-align: left;
    background: none; color: var(--fg); border: 0; padding: 8px 0; font: inherit; font-size: 1.3rem; font-weight: 650; cursor: pointer;
  }
  .toggle .ico { color: var(--accent); width: 1.2em; text-align: center; flex: 0 0 auto; }
  .toggle .count { margin-left: auto; font-size: .9rem; font-weight: 400; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .toggle .chev { color: var(--muted); font-size: 1rem; transition: transform .2s; flex: 0 0 auto; }
  .toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .body { padding: 4px 0 8px; }
  .empty { color: var(--muted); margin: 6px 0; }
  .meta { color: var(--muted); font-size: .9rem; margin: 0 0 12px; overflow-wrap: anywhere; }

  /* Marks and item rows */
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items > li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 8px; padding: 8px 0; border-bottom: 1px solid var(--border); min-width: 0; }
  .mark { font-weight: 700; text-align: center; }
  .t { overflow-wrap: anywhere; }
  .n { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
  .tag { display: inline-block; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 8px; margin-bottom: 4px; }
  .m-done { color: var(--ok); }
  .m-fail { color: var(--bad); }
  .m-owner { color: var(--warn); }

  /* Failing: severity blocks */
  .sevblock { margin-top: 14px; border: 1px solid var(--border); border-left: 6px solid var(--tone); border-radius: 12px; background: var(--surface); padding: 12px 16px 6px; }
  .sevblock:first-of-type { margin-top: 4px; }
  .sevblock > h3 { display: flex; align-items: baseline; gap: 10px; font-size: 1.05rem; color: var(--tone); }
  .sevblock > h3 .c { color: var(--muted); font-size: .85rem; font-weight: 400; font-variant-numeric: tabular-nums; }
  .sevblock .desc { color: var(--muted); font-size: .85rem; margin: 2px 0 4px; }
  .sevblock ul.items > li:last-child { border-bottom: 0; }
  .s-block { --tone: var(--bad); }
  .s-fix { --tone: var(--warn); }
  .s-limit { --tone: var(--plan); }

  /* Done: compact groups */
  .areas { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 32px; }
  .area { margin: 14px 0 0; min-width: 0; break-inside: avoid; }
  .area h3 { display: flex; align-items: baseline; gap: 8px; font-size: .8rem; color: var(--accent); text-transform: uppercase; letter-spacing: .07em; padding-bottom: 4px; border-bottom: 1px solid var(--border-strong); }
  .area h3 .c { color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .area ul.items > li { padding: 5px 0; border-bottom: 0; grid-template-columns: 22px minmax(0, 1fr); font-size: .93rem; }
  .area .src { display: block; }

  /* Cards: in progress and planned */
  ul.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  ul.cards > li { display: flex; flex-direction: column; gap: 6px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .chip { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; font-size: .75rem; font-weight: 600; line-height: 1.4; color: var(--tone, var(--muted)); border: 1px solid currentColor; border-radius: 999px; padding: 0 9px; white-space: nowrap; }
  ul.cards .t { font-weight: 550; }
  ul.cards .src { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
  ul.cards .n + .src { margin-top: auto; }

  /* Owner checklist */
  ul.checklist { list-style: none; margin: 0; padding: 0; }
  ul.checklist > li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 10px; padding: 12px 0; border-bottom: 1px solid var(--border); min-width: 0; }
  .box { width: 20px; height: 20px; margin-top: 2px; border: 2px solid var(--warn); border-radius: 5px; }
  ul.checklist .t { font-weight: 700; }

  /* Timeline */
  ol.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--border-strong); }
  ol.timeline > li { position: relative; padding: 8px 0 12px 18px; min-width: 0; }
  ol.timeline > li::before { content: ""; position: absolute; left: -22px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--bg); }
  .tl-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: .88rem; color: var(--muted); }
  .tl-head code { color: var(--accent); }
  .tl-head .when { font-variant-numeric: tabular-nums; }
  .k-fix { --tone: var(--bad); }
  .k-feat { --tone: var(--ok); }
  .k-docs { --tone: var(--plan); }
  .k-chore, .k-other { --tone: var(--muted); }
  .subj { overflow-wrap: anywhere; margin-top: 2px; }

  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--border); padding-top: 14px; overflow-wrap: anywhere; }

  @media (min-width: 768px) {
    .wrap { padding: 40px 32px 80px; }
    h1 { font-size: 2.5rem; }
    .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .tile .num { font-size: 2.8rem; }
    ul.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .areas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 1200px) {
    ul.cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <p class="eyebrow">Development map</p>
  <h1>Voyagr</h1>
  <p class="tagline" id="tagline"></p>
  <div class="facts" id="facts"></div>
  <p class="live-status" id="live-status" aria-live="polite"></p>
</header>

<div class="toolbar">
  <div class="grow">
    <label for="q">Search items across sections</label>
    <input type="search" id="q" placeholder="Type to filter, for example: Resend" autocomplete="off">
  </div>
  <button type="button" class="btn" id="copy-md">Copy as Markdown</button>
</div>
<p class="live" id="copy-status" role="status" aria-live="polite"></p>
<div class="fallback" id="copy-fallback" hidden>
  <label for="md-out" class="muted">Clipboard is not available here. The text is selected below: press Ctrl+C (or Cmd+C) to copy it.</label>
  <textarea id="md-out" readonly></textarea>
</div>

<main id="main"></main>

<footer id="foot"></footer>
</div>

<!-- Optional: written by `npm run devmap:update`. The page renders without it. -->
<script id="devmap-live" src="devmap-live.js"></script>
<script>

// ---------------------------------------------------------------------------
// Rendering. Reads only from DATA. All text goes in through textContent.
// ---------------------------------------------------------------------------
(function () {
  "use strict";

  var COMMIT_TAG = {
    fix: "fix", feat: "feat", docs: "docs", chore: "build", mixed: "feat + fixes", other: "no detail"
  };
  var COMMIT_CLASS = { fix: "k-fix", feat: "k-feat", mixed: "k-feat", docs: "k-docs", chore: "k-chore", other: "k-other" };
  var SEV_ORDER = ["blocks launch", "should fix", "known limit"];
  var SEV_META = {
    "blocks launch": { title: "Blocks launch", cls: "s-block", desc: "Must be resolved or verified before going live." },
    "should fix": { title: "Should fix", cls: "s-fix", desc: "Real defects or unverified claims; launch is possible but poorer." },
    "known limit": { title: "Known limit", cls: "s-limit", desc: "Understood constraints, not expected to be fixed soon." }
  };
  var AREAS = ["Data & caching", "Flights & prices", "Destination page", "Globe & home",
    "Explore & trip builder", "Stays", "Accounts & email", "Trips hub", "Design & pages", "Docs", "Quality"];

  var state = {};  // section key -> open (true by default)
  var manual = {}; // while searching: section key -> open, set by a click
  // Rebuilt on every render, so counts and lists follow DATA after a live update.
  function sectionsFromData() {
    return [
      { key: "failing", title: "Failing or unverified", icon: "✕", list: DATA.failing, count: DATA.failing.length },
      { key: "done", title: "Done", icon: "✓", list: DATA.done, count: DATA.done.length },
      { key: "progress", title: "In progress", icon: "◐", list: DATA.inProgress, count: DATA.inProgress.length },
      { key: "planned", title: "Planned, not started", icon: "○", list: DATA.planned, count: DATA.planned.length },
      { key: "owner", title: "Needs the owner", icon: "⚑", list: DATA.needsOwner, count: DATA.needsOwner.length },
      { key: "history", title: "Recent history", icon: "•", list: DATA.commits, count: DATA.commits.length }
    ];
  }
  var SECTIONS = sectionsFromData();
  SECTIONS.forEach(function (s) { state[s.key] = true; });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;

  function sectionOpen(key) {
    if (query() !== "") return key in manual ? manual[key] : true;
    return state[key];
  }

  function itemSearch(it) {
    return [it.text, it.area, it.tag, it.note, it.src, it.severity, it.subject, it.hash, it.date]
      .filter(Boolean).join(" ");
  }

  function markFor(sectionKey) {
    if (sectionKey === "done") return ["✓", "m-done"];
    if (sectionKey === "progress") return ["◐", "m-prog"];
    if (sectionKey === "planned") return ["○", "m-plan"];
    if (sectionKey === "failing") return ["✕", "m-fail"];
    if (sectionKey === "owner") return ["⚑", "m-owner"];
    return ["•", ""];
  }

  // A small label for items that change or depend on LiteAPI (Nuitee).
  function tagBadge(it) { return el("span", "tag", it.tag); }

  // A row with a mark, the text, and optional note and source.
  function renderRow(sectionKey, it, withNote) {
    var li = el("li");
    li.dataset.search = itemSearch(it).toLowerCase();
    var mk = markFor(sectionKey);

    var body = el("div");
    if (it.tag) body.appendChild(tagBadge(it));
    body.appendChild(el("span", "t", it.text));
    if (withNote && it.note) body.appendChild(el("div", "n", it.note));
    if (it.src) body.appendChild(el("div", "src", "Source: " + it.src));
    li.appendChild(body);
    return li;
  }

  // A card for in-progress and planned items. The status is a word and an icon.
  function renderCard(sectionKey, it) {
    var li = el("li");
    li.dataset.search = itemSearch(it).toLowerCase();
    var word = sectionKey === "progress" ? "In progress" : "Planned";
    var chip = el("span", "chip " + (sectionKey === "progress" ? "t-prog" : "t-plan"));
    chip.appendChild(decor("span", "", markFor(sectionKey)[0]));
    chip.appendChild(document.createTextNode(word));
    li.appendChild(chip);
    if (it.tag) li.appendChild(tagBadge(it));
    li.appendChild(el("div", "t", it.text));
    if (it.note) li.appendChild(el("div", "n", it.note));
    if (it.src) li.appendChild(el("div", "src", "Source: " + it.src));
    return li;
  }

  function renderOwner(it) {
    var li = el("li");
    li.dataset.search = itemSearch(it).toLowerCase();
    li.appendChild(decor("span", "box"));
    var body = el("div");
    if (it.tag) body.appendChild(tagBadge(it));
    body.appendChild(el("div", "t", it.text));
    if (it.src) body.appendChild(el("div", "src", "Source: " + it.src));
    li.appendChild(body);
    return li;
  }

  function renderHistoryItem(c) {
    var li = el("li");
    li.dataset.search = itemSearch(c).toLowerCase();
    var head = el("div", "tl-head");
    head.appendChild(el("code", "", c.hash));
    head.appendChild(el("span", "when", c.date));
    head.appendChild(el("span", "chip " + (COMMIT_CLASS[c.kind] || "k-other"), COMMIT_TAG[c.kind] || c.kind));
    li.appendChild(head);
    li.appendChild(el("div", "subj", c.subject));
    return li;
  }

  function sectionShell(s) {
    var sec = el("section", "panel");
    sec.id = "sec-" + s.key;
    var h = el("h2");
    var btn = el("button", "toggle");
    btn.type = "button";
    btn.id = "btn-" + s.key;
    btn.setAttribute("aria-controls", "body-" + s.key);
    btn.setAttribute("aria-expanded", "true");
    btn.dataset.sec = s.key;
    if (s.icon) btn.appendChild(decor("span", "ico", s.icon));
    btn.appendChild(document.createTextNode(s.title));
    var cnt = el("span", "count");
    btn.appendChild(cnt);
    btn.appendChild(decor("span", "chev", "▾"));
    h.appendChild(btn);
    sec.appendChild(h);
    var body = el("div", "body");
    body.id = "body-" + s.key;
    body.setAttribute("role", "region");
    body.setAttribute("aria-labelledby", "btn-" + s.key);
    sec.appendChild(body);
    return { sec: sec, body: body, btn: btn, cnt: cnt };
  }

  function buildHeader() {
    document.getElementById("tagline").textContent = DATA.subtitle;
    var f = document.getElementById("facts");
    function row(label, build, title) {
      var d = el("div", "fact");
      d.appendChild(el("span", "k", label));
      var v = el("span", "v");
      build(v);
      if (title) v.title = title;
      d.appendChild(v);
      f.appendChild(d);
    }
    row("Branch", function (v) { v.textContent = DATA.branch; }, DATA.branch);
    row("Last commit", function (v) {
      v.appendChild(el("code", "", DATA.lastCommit.hash));
      v.appendChild(document.createTextNode(DATA.lastCommit.subject));
      if (DATA.lastCommit.date) v.appendChild(el("span", "muted", "  " + DATA.lastCommit.date));
    }, DATA.lastCommit.hash + " " + DATA.lastCommit.subject);
    row("Working tree", function (v) {
      v.textContent = DATA.uncommittedPaths + " paths, " + DATA.uncommittedUntracked + " untracked";
    });
    row("Generated", function (v) { v.textContent = DATA.generated; });
  }

  function buildStrip(main) {
    var strip = el("section", "strip");
    strip.setAttribute("aria-labelledby", "h-summary");
    var h = el("h2", "sr-only", "Status summary");
    h.id = "h-summary";
    strip.appendChild(h);
    var tiles = [
      { icon: "✓", label: "Done", n: DATA.done.length, cls: "t-done", href: "#sec-done", sub: "items" },
      { icon: "◐", label: "In progress", n: DATA.inProgress.length, cls: "t-prog", href: "#sec-progress", sub: "items" },
      { icon: "○", label: "Planned", n: DATA.planned.length, cls: "t-plan", href: "#sec-planned", sub: "items" },
      { icon: "⚑", label: "Needs you", n: DATA.needsOwner.length, cls: "t-owner", href: "#sec-owner", sub: "owner actions" }
    ];
    var total = 0;
    tiles.forEach(function (t) { total += t.n; });
    function pct(n) { return total ? Math.round(n * 100 / total) : 0; }

    var ul = el("ul", "tiles");
    tiles.forEach(function (t) {
      var li = el("li");
      var a = el("a", "tile " + t.cls);
      a.href = t.href;
      var lbl = el("div", "lbl");
      lbl.appendChild(decor("span", "ico", t.icon));
      lbl.appendChild(document.createTextNode(t.label));
      a.appendChild(lbl);
      a.appendChild(el("div", "num", String(t.n)));
      a.appendChild(el("div", "sub", t.sub + " · " + pct(t.n) + "% of all"));
      li.appendChild(a);
      ul.appendChild(li);
    });
    strip.appendChild(ul);

    var summary = tiles.map(function (t) { return t.label + " " + t.n + " (" + pct(t.n) + "%)"; }).join(", ");
    var bar = el("div", "bar");
    bar.setAttribute("role", "img");
    bar.setAttribute("aria-label", "Share of all " + total + " items: " + summary);
    tiles.forEach(function (t) {
      var seg = el("span", t.cls);
      seg.style.flexGrow = String(t.n);
      seg.style.flexBasis = "0";
      bar.appendChild(seg);
    });
    strip.appendChild(bar);

    var note = el("p", "bar-note");
    note.appendChild(document.createTextNode("Bar: share of all " + total + " items across the four tiles, left to right. "));
    var fl = el("a", "", DATA.failing.length + " failing or unverified");
    fl.href = "#sec-failing";
    note.appendChild(fl);
    note.appendChild(document.createTextNode(" are counted separately below."));
    strip.appendChild(note);
    main.appendChild(strip);
  }

  function buildNext(main) {
    var card = el("section", "next");
    card.setAttribute("aria-labelledby", "h-next");
    card.appendChild(el("p", "eyebrow", DATA.nextStep.namesOne ? "Recommended" : "Not named in the sources"));
    var h = el("h2", "", "Recommended next step");
    h.id = "h-next";
    card.appendChild(h);
    card.appendChild(el("p", "", DATA.nextStep.text));
    card.appendChild(el("p", "muted", DATA.nextStep.pointer));
    card.appendChild(el("p", "", "Why: " + DATA.nextStep.why));
    card.appendChild(el("p", "src", "Source: " + DATA.nextStep.src));
    main.appendChild(card);
  }

  function buildFailing(body) {
    var sevs = SEV_ORDER.slice();
    DATA.failing.forEach(function (it) { if (sevs.indexOf(it.severity) === -1) sevs.push(it.severity); });
    sevs.forEach(function (sev) {
      var items = DATA.failing.filter(function (d) { return d.severity === sev; });
      if (!items.length) return;
      var meta = SEV_META[sev] || { title: String(sev), cls: "s-limit", desc: "" };
      var block = el("div", "sevblock " + meta.cls);
      block.dataset.group = "1";
      var h = el("h3");
      h.appendChild(decor("span", "", "✕"));
      h.appendChild(document.createTextNode(meta.title));
      var c = el("span", "c", String(items.length));
      c.dataset.total = String(items.length);
      h.appendChild(c);
      block.appendChild(h);
      if (meta.desc) block.appendChild(el("p", "desc", meta.desc));
      var ul = el("ul", "items");
      items.forEach(function (it) { ul.appendChild(renderRow("failing", it, true)); });
      block.appendChild(ul);
      body.appendChild(block);
    });
  }

  function buildDone(body) {
    var wrap = el("div", "areas");
    var areas = AREAS.slice();
    DATA.done.forEach(function (d) { if (areas.indexOf(d.area) === -1) areas.push(d.area); });
    areas.forEach(function (area) {
      var items = DATA.done.filter(function (d) { return d.area === area; });
      if (!items.length) return;
      var group = el("div", "area");
      group.dataset.group = "1";
      var h = el("h3", "", area);
      var c = el("span", "c", String(items.length));
      c.dataset.total = String(items.length);
      h.appendChild(c);
      group.appendChild(h);
      var ul = el("ul", "items");
      items.forEach(function (d) { ul.appendChild(renderRow("done", d, false)); });
      group.appendChild(ul);
      wrap.appendChild(group);
    });
    body.appendChild(wrap);
  }

  function buildMain() {
    var main = document.getElementById("main");
    buildStrip(main);
    buildNext(main);

    SECTIONS.forEach(function (s) {
      var sh = sectionShell(s);
      if (s.key === "failing") {
        buildFailing(sh.body);
      } else if (s.key === "done") {
        buildDone(sh.body);
      } else if (s.key === "history") {
        sh.body.appendChild(el("p", "meta", "Newest first. Labels: fix, feat, docs, build; \"feat + fixes\" marks a feature commit that also contains security or bug fixes."));
        var ol = el("ol", "timeline");
        DATA.commits.forEach(function (c) { ol.appendChild(renderHistoryItem(c)); });
        sh.body.appendChild(ol);
      } else if (s.key === "progress" || s.key === "planned") {
        var cards = el("ul", "cards");
        s.list.forEach(function (it) { cards.appendChild(renderCard(s.key, it)); });
        sh.body.appendChild(cards);
      } else if (s.key === "owner") {
        var cl = el("ul", "checklist");
        s.list.forEach(function (it) { cl.appendChild(renderOwner(it)); });
        sh.body.appendChild(cl);
      }
      var empty = el("p", "empty", "No items match the search in this section.");
      empty.hidden = true;
      empty.dataset.empty = s.key;
      sh.body.insertBefore(empty, sh.body.firstChild);
      main.appendChild(sh.sec);
      s.shell = sh;
    });
    buildFoot();
  }

  function buildFoot() {
    var f = document.getElementById("foot");
    f.textContent = "Generated " + DATA.generated + " from STATUS.md, docs/finish-plan.md, progress.md, docs/design-direction.md, docs/design-trip-builder.md, docs/design-destination.md, docs/testing.md, WHAT-I-NEED-FROM-YOU.md and the last 15 commits. Nothing was re-run. Edit DATA at the top of the script to change a status.";
  }

  function applyFilter() {
    var q = query();
    SECTIONS.forEach(function (s) {
      var sh = s.shell;
      var open = sectionOpen(s.key);
      sh.body.hidden = !open;
      sh.btn.setAttribute("aria-expanded", open ? "true" : "false");
      var visible = 0;
      Array.prototype.forEach.call(sh.body.querySelectorAll("li[data-search]"), function (li) {
        var ok = hit(li.dataset.search, q);
        li.hidden = !ok;
        if (ok) visible++;
      });
      Array.prototype.forEach.call(sh.body.querySelectorAll("[data-group]"), function (g) {
        var shown = g.querySelectorAll("li[data-search]:not([hidden])").length;
        g.hidden = shown === 0;
        var c = g.querySelector(".c");
        if (c) c.textContent = q ? (shown + " of " + c.dataset.total) : c.dataset.total;
      });
      var empty = sh.body.querySelector("p.empty[data-empty]");
      if (empty) empty.hidden = !(q && visible === 0);
      sh.cnt.textContent = q ? (visible + " of " + s.count + " shown") : (s.count + " items");
    });
  }

  function toMarkdown() {
    var q = query();
    var out = [];
    out.push("# Voyagr development map (" + DATA.generated + ")");
    out.push("");
    out.push("Branch: " + DATA.branch);
    out.push("Last commit: " + DATA.lastCommit.hash + " " + DATA.lastCommit.subject);
    out.push("");
    out.push("## Status summary");
    out.push("- Done: " + DATA.done.length);
    out.push("- In progress: " + DATA.inProgress.length);
    out.push("- Planned (not started): " + DATA.planned.length);
    out.push("- Needs the owner: " + DATA.needsOwner.length);
    out.push("");
    if (hit(DATA.nextStep.text + " " + DATA.nextStep.pointer + " " + DATA.nextStep.why, q)) {
      out.push("## Recommended next step");
      out.push(DATA.nextStep.text);
      out.push(DATA.nextStep.pointer);
      out.push("Why: " + DATA.nextStep.why);
      out.push("");
    }
    SECTIONS.forEach(function (s) {
      if (!sectionOpen(s.key)) return;
      var lines = [];
      if (s.key === "done") {
        var areas = AREAS.slice();
        DATA.done.forEach(function (d) { if (areas.indexOf(d.area) === -1) areas.push(d.area); });
        areas.forEach(function (area) {
          var items = DATA.done.filter(function (d) { return d.area === area && hit(itemSearch(d), q); });
          if (!items.length) return;
          lines.push("### " + area);
          items.forEach(function (d) { lines.push("- ✓ " + d.text); });
        });
      } else if (s.key === "history") {
        DATA.commits.filter(function (c) { return hit(itemSearch(c), q); })
          .forEach(function (c) { lines.push("- " + c.hash + " (" + c.date + ") " + c.subject); });
      } else {
        var icon = markFor(s.key)[0];
        s.list.filter(function (it) { return hit(itemSearch(it), q); }).forEach(function (it) {
          var line = "- " + icon + " ";
          if (it.severity) line += "[" + it.severity + "] ";
          line += it.text;
          if (it.note) line += " (" + it.note + ")";
          if (it.src) line += " [source: " + it.src + "]";
          lines.push(line);
        });
      }
      if (!lines.length) return;
      out.push("## " + s.title);
      out.push("");
      lines.forEach(function (l) { out.push(l); });
      out.push("");
    });
    return out.join("\n");
  }

  function copyMarkdown() {
    var md = toMarkdown();
    var status = document.getElementById("copy-status");
    var fb = document.getElementById("copy-fallback");
    var ta = document.getElementById("md-out");
    function fallback(msg) {
      fb.hidden = false;
      ta.value = md;
      status.textContent = msg;
      ta.focus();
      ta.select();
    }
    function ok() {
      fb.hidden = true;
      status.textContent = "Copied the visible content as Markdown.";
    }
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      navigator.clipboard.writeText(md).then(ok, function () {
        fallback("Clipboard write was refused by the browser. The text is selected below: press Ctrl+C (or Cmd+C).");
      });
    } else {
      fallback("Clipboard is not available in this browser or context. The text is selected below: press Ctrl+C (or Cmd+C).");
    }
  }

  // ---------------------------------------------------------------------------
  // Live facts. devmap-live.js is written by `npm run devmap:update` and is
  // optional. Only these DATA fields are overwritten; every other field stays
  // as written in DATA above.
  // ---------------------------------------------------------------------------
  var LIVE_POLL_MS = 20000;
  var liveLoaded = false;
  var shownGenerated = null; // the `generated` value last rendered from live facts

  function isStr(v) { return typeof v === "string"; }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function applyLive() {
    var live = window.DEVMAP_LIVE;
    if (!live || typeof live !== "object" || !isStr(live.generated)) return;
    liveLoaded = true;
    shownGenerated = live.generated;
    DATA.generated = live.generated;
    if (isStr(live.branch)) DATA.branch = live.branch;
    if (live.lastCommit && isStr(live.lastCommit.hash) && isStr(live.lastCommit.subject)) {
      DATA.lastCommit = {
        hash: live.lastCommit.hash,
        subject: live.lastCommit.subject,
        date: isStr(live.lastCommit.date) ? live.lastCommit.date : ""
      };
    }
    if (isNum(live.uncommittedPaths)) DATA.uncommittedPaths = live.uncommittedPaths;
    if (isNum(live.uncommittedUntracked)) DATA.uncommittedUntracked = live.uncommittedUntracked;
    if (Array.isArray(live.commits)) {
      DATA.commits = live.commits.filter(function (c) {
        return c && isStr(c.hash) && isStr(c.date) && isStr(c.subject);
      });
    }
  }

  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function setLiveStatus() {
    var n = document.getElementById("live-status");
    if (!n) return;
    var d = liveLoaded ? new Date(DATA.generated) : null;
    if (d && !isNaN(d.getTime())) {
      n.textContent = "Live facts updated " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
    } else {
      n.textContent = "Live facts not loaded: showing the values in this file. Run npm run devmap:update to refresh them.";
    }
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function render() {
    applyLive();
    // Rebuilding replaces the nodes, so keep keyboard focus on a section toggle.
    var active = document.activeElement;
    var focusId = active && active.classList && active.classList.contains("toggle") ? active.id : "";
    clear(document.getElementById("facts"));
    clear(document.getElementById("main"));
    SECTIONS = sectionsFromData();
    buildHeader();
    buildMain();
    applyFilter();
    setLiveStatus();
    if (focusId) {
      var again = document.getElementById(focusId);
      if (again) again.focus({ preventScroll: true });
    }
  }

  // Re-load devmap-live.js every LIVE_POLL_MS. The cache-busting query works on
  // file:// too; the old script element is removed so each load runs fresh.
  function onLiveLoaded() {
    var live = window.DEVMAP_LIVE;
    if (live && isStr(live.generated) && live.generated !== shownGenerated) render();
  }
  function reloadLive() {
    var old = document.getElementById("devmap-live");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var s = document.createElement("script");
    s.id = "devmap-live";
    s.src = "devmap-live.js?t=" + Date.now();
    s.addEventListener("load", onLiveLoaded);
    document.body.appendChild(s);
  }

  function init() {
    render();
    setInterval(reloadLive, LIVE_POLL_MS);

    document.getElementById("main").addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("button.toggle") : null;
      if (!b) return;
      var key = b.dataset.sec;
      if (query()) {
        manual[key] = !sectionOpen(key);
      } else {
        state[key] = !state[key];
      }
      applyFilter();
    });
    document.getElementById("q").addEventListener("input", function () {
      manual = {};
      applyFilter();
    });
    document.getElementById("copy-md").addEventListener("click", copyMarkdown);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
